<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="440" fill="#ffffff"/>

  <!-- NUCLEO board -->
  <rect x="30" y="40" width="380" height="360" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="220" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">NUCLEO-F446ZE</text>
  <text x="220" y="92" text-anchor="middle" font-size="12" fill="#555">(Arduino UNO V3 호환 헤더 = 같은 위치)</text>

  <!-- ST-LINK USB -->
  <rect x="160" y="20" width="120" height="30" rx="4" fill="#cfd8dc" stroke="#333"/>
  <text x="220" y="40" text-anchor="middle" font-size="12" fill="#111">ST-LINK USB → PC</text>

  <!-- MCU -->
  <rect x="70" y="160" width="140" height="140" fill="#263238" stroke="#111"/>
  <text x="140" y="225" text-anchor="middle" font-size="14" fill="#fff">STM32F446ZE</text>
  <text x="140" y="245" text-anchor="middle" font-size="11" fill="#cfd8dc">USART6_TX = PG14</text>

  <!-- Upper header (CN7 side): GND -->
  <rect x="300" y="120" width="90" height="110" fill="#212121" stroke="#000"/>
  <text x="345" y="112" text-anchor="middle" font-size="11" fill="#333">CN7 (상단 헤더)</text>
  <g font-size="11" fill="#fff">
    <text x="312" y="140">AREF</text>
    <text x="312" y="162" font-weight="bold" fill="#ffeb3b">GND</text>
    <text x="312" y="184">D13</text>
    <text x="312" y="206">D12 …</text>
  </g>
  <circle cx="380" cy="158" r="5" fill="#ffeb3b"/>

  <!-- Lower header (CN10 side): D1 -->
  <rect x="300" y="260" width="90" height="110" fill="#212121" stroke="#000"/>
  <text x="345" y="388" text-anchor="middle" font-size="11" fill="#333">CN10 (하단 헤더)</text>
  <g font-size="11" fill="#fff">
    <text x="312" y="280">D3</text>
    <text x="312" y="302">D2</text>
    <text x="312" y="324" font-weight="bold" fill="#ff8a80">D1 PG14</text>
    <text x="312" y="346">D0 (미사용)</text>
  </g>
  <circle cx="380" cy="320" r="5" fill="#ff5252"/>

  <!-- Oscilloscope -->
  <rect x="560" y="110" width="270" height="230" rx="8" fill="#f0a500" stroke="#333" stroke-width="2"/>
  <rect x="580" y="130" width="230" height="170" fill="#cfd8dc" stroke="#333"/>
  <g stroke="#9aa5ab" stroke-width="1">
    <line x1="580" y1="172" x2="810" y2="172"/><line x1="580" y1="215" x2="810" y2="215"/><line x1="580" y1="257" x2="810" y2="257"/>
    <line x1="637" y1="130" x2="637" y2="300"/><line x1="695" y1="130" x2="695" y2="300"/><line x1="752" y1="130" x2="752" y2="300"/>
  </g>
  <!-- sample UART waveform: idle 1, start 0, 1 0 0 0 0 0 1 0, stop 1 -->
  <polyline fill="none" stroke="#1565c0" stroke-width="2"
    points="585,180 600,180 600,250 618,250 618,180 636,180 636,250 726,250 726,180 744,180 744,250 762,250 762,180 805,180"/>
  <text x="695" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Oscilloscope CH1</text>
  <circle cx="560" cy="200" r="6" fill="#111"/>
  <circle cx="560" cy="250" r="6" fill="#e53935"/>
  <text x="548" y="196" text-anchor="end" font-size="11" fill="#111">GND 클립</text>
  <text x="548" y="268" text-anchor="end" font-size="11" fill="#c62828">프로브 팁</text>

  <!-- Wires -->
  <path d="M385,158 C470,158 470,200 554,200" fill="none" stroke="#111" stroke-width="4"/>
  <path d="M385,320 C470,320 470,250 554,250" fill="none" stroke="#e53935" stroke-width="4"/>

  <text x="430" y="425" text-anchor="middle" font-size="12" fill="#333">빨강: D1(PG14, USART6_TX) → 프로브 팁 · 검정: GND → 접지 클립 · 신호 레벨 0~3.3V</text>
</svg>
